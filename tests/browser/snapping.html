<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Snap event browser fixture</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body,
      #map {
        margin: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script type="module">
      import { Map, setWorkerUrl } from "maplibre-gl";
      import workerUrl from "maplibre-gl/dist/maplibre-gl-worker.mjs?worker&url";
      import { Geoman } from "@geoman-io/maplibre-geoman-free";
      import { GeoEditor } from "/src/lib/core/GeoEditor.ts";
      import "maplibre-gl/dist/maplibre-gl.css";
      import "@geoman-io/maplibre-geoman-free/dist/maplibre-geoman.css";
      import "/src/lib/styles/geo-editor.css";

      setWorkerUrl(workerUrl);
      const map = new Map({
        container: "map",
        center: [0, 0],
        zoom: 15,
        style: {
          version: 8,
          sources: {},
          layers: [
            {
              id: "background",
              type: "background",
              paint: { "background-color": "#f2f4f7" },
            },
          ],
        },
      });
      const errors = [];
      window.addEventListener("error", (event) => errors.push(event.message));
      map.on("error", (event) => errors.push(String(event.error)));
      map.once("load", () => {
        const gm = new Geoman(map, {});
        map.once("gm:loaded", async () => {
          const events = [];
          const created = [];
          const editor = new GeoEditor({
            snapEventsEnabled: true,
            onFeatureCreate: (feature) =>
              created.push(structuredClone(feature)),
            showFeatureProperties: false,
          });
          editor.setGeoman(gm);
          map.addControl(editor, "top-left");
          for (const name of ["gm:snap", "gm:unsnap"]) {
            map.getContainer().addEventListener(name, (event) => {
              events.push({ name, ...structuredClone(event.detail) });
            });
          }
          const endpoints = [
            [400, 300],
            [700, 300],
          ].map((point) => map.unproject(point).toArray());
          await gm.features.importGeoJsonFeature({
            type: "Feature",
            id: "target-way",
            properties: {
              osm_id: "way/123",
              osm_version: 7,
              node_ids: ["node/1", "node/2"],
            },
            geometry: { type: "LineString", coordinates: endpoints },
          });
          window.snapTest = {
            map,
            gm,
            editor,
            events,
            created,
            endpoints,
            errors,
          };
        });
      });
    </script>
  </body>
</html>
